name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Accept Android SDK Licenses
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses" || true
          echo -e "24333f8a63565f179720b422a7e4e64118d3742c\n89337d0c3dbb327e517b3123bc8b54213070e2d3\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Prepare Keystores & Environment
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > "${GITHUB_WORKSPACE}/debug.keystore" 2>/dev/null || true
          fi
          
          if [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ] || [ ! -s "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp "${GITHUB_WORKSPACE}/debug.keystore" "${GITHUB_WORKSPACE}/app/debug.keystore" || true
          
          if [ ! -f "${GITHUB_WORKSPACE}/my-upload-key.jks" ] || [ ! -s "${GITHUB_WORKSPACE}/my-upload-key.jks" ]; then
            keytool -genkeypair -v -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -storepass android -alias upload -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=SafeBridge,O=SafeBridge,C=US"
          fi
          cp "${GITHUB_WORKSPACE}/my-upload-key.jks" "${GITHUB_WORKSPACE}/app/my-upload-key.jks" || true
          
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Build Debug & Release APK
        run: |
          ./gradlew assembleDebug --no-daemon --no-configuration-cache
          ./gradlew assembleRelease --no-daemon --no-configuration-cache
          ./gradlew bundleRelease --no-daemon --no-configuration-cache
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Djava.awt.headless=true"

      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release & Upload Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: SafeBridge ${{ steps.vars.outputs.TAG }}
          body: |
            ### SafeBridge Release ${{ steps.vars.outputs.TAG }}
            
            Educational Android Application for Secure Binder IPC, Sandbox Containment & Policy-Enforced Safe ADB Controller.
            
            #### 📦 Download Assets:
            - **Debug APK:** Direct installable APK with debug logging.
            - **Release APK:** Production optimized APK.
            - **App Bundle (.aab):** Google Play release bundle.
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          draft: false
          prerelease: false
