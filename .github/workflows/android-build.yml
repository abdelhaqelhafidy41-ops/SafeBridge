name: Build Android APK & Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build Release APK & Bundle'
        required: true
        type: boolean
        default: true
      run_tests:
        description: 'Run Unit & Robolectric Tests'
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package Android App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Step 2: Setup Java Development Kit (JDK 21)
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Step 3: Accept Android SDK Licenses
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/licenses" || true
          echo -e "24333f8a63565f179720b422a7e4e64118d3742c\n89337d0c3dbb327e517b3123bc8b54213070e2d3\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          yes | sdkmanager --licenses 2>/dev/null || true

      # Step 4: Setup Gradle and Cache Dependencies
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      # Step 5: Grant Execution Permission for Gradle Wrapper
      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # Step 6: Setup Environment & Absolute Path Keystores
      - name: Prepare Keystores & Environment
        run: |
          echo "Setting up keystores with absolute paths..."
          
          # Restore debug.keystore if base64 exists, otherwise generate
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > "${GITHUB_WORKSPACE}/debug.keystore" 2>/dev/null || true
          fi
          
          if [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ] || [ ! -s "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp "${GITHUB_WORKSPACE}/debug.keystore" "${GITHUB_WORKSPACE}/app/debug.keystore" || true
          
          # Generate upload keystore for release build
          if [ ! -f "${GITHUB_WORKSPACE}/my-upload-key.jks" ] || [ ! -s "${GITHUB_WORKSPACE}/my-upload-key.jks" ]; then
            keytool -genkeypair -v -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -storepass android -alias upload -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=SafeBridge,O=SafeBridge,C=US"
          fi
          cp "${GITHUB_WORKSPACE}/my-upload-key.jks" "${GITHUB_WORKSPACE}/app/my-upload-key.jks" || true
          
          # Ensure .env exists
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      # Step 7: Build Debug APK (Proven Successful ✅)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Djava.awt.headless=true"

      # Step 8: Upload Debug APK Artifact immediately
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SafeBridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Step 9: Build Release APK & Bundle
      - name: Build Release APK & AAB
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_release }}
        run: |
          ./gradlew assembleRelease --no-daemon --no-configuration-cache --stacktrace
          ./gradlew bundleRelease --no-daemon --no-configuration-cache --stacktrace
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Djava.awt.headless=true"

      # Step 10: Upload Release APK Artifact
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SafeBridge-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # Step 11: Upload Release AAB (Play Store Bundle)
      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SafeBridge-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14

      # Step 12: Run Tests (Optional)
      - name: Run Tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace
        env:
          STORE_PASSWORD: android
          KEY_PASSWORD: android
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Djava.awt.headless=true"

      # Step 13: Upload Test Results Report
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SafeBridge-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
