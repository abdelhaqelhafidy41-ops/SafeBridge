name: Build Android APK & Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build Release APK & Bundle'
        required: true
        type: boolean
        default: true
      run_tests:
        description: 'Run Unit & Robolectric Tests'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package Android App
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Step 2: Setup Java Development Kit (JDK 17)
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Setup Gradle and Cache Dependencies
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      # Step 4: Grant Execution Permission for Gradle Wrapper
      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # Step 5: Setup Environment & Keystores for CI Build
      - name: Prepare Keystores & Environment
        run: |
          echo "Setting up keystores for debug and release builds..."
          
          # Restore debug.keystore if base64 encoded file exists, otherwise generate one
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # Ensure release upload keystore exists for assembleRelease
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkey -v -keystore my-upload-key.jks -storepass "${STORE_PASS}" -alias "${KEY_ALIAS}" -keypass "${KEY_PASS}" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SafeBridge,O=SafeBridge,C=US"
          fi
          
          # Create placeholder .env if not present
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi
        env:
          STORE_PASS: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}

      # Step 6: Run Unit & Robolectric Tests
      - name: Run Tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

      # Step 7: Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

      # Step 8: Build Release APK & Bundle (Optional/Conditional)
      - name: Build Release APK & AAB
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_release }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          ./gradlew bundleRelease --no-daemon --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

      # Step 9: Upload Debug APK Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeBridge-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # Step 10: Upload Release APK Artifact
      - name: Upload Release APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_release }}
        uses: actions/upload-artifact@v4
        with:
          name: SafeBridge-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      # Step 11: Upload Release AAB (Play Store Bundle)
      - name: Upload Release Bundle (AAB)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_release }}
        uses: actions/upload-artifact@v4
        with:
          name: SafeBridge-release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14

      # Step 12: Upload Test Results Report
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SafeBridge-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
